name: Release APK

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v6

      - name: Check the tag matches VERSION_NAME
        run: |
          version=$(grep '^VERSION_NAME=' gradle.properties | cut -d= -f2)
          [ "v$version" = "$GITHUB_REF_NAME" ] || { echo "::error::Tag $GITHUB_REF_NAME but VERSION_NAME is $version"; exit 1; }

      - name: Build signed APK
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEYSTORE_FILE: ${{ runner.temp }}/release.jks
        run: |
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$KEYSTORE_FILE"
          chmod +x gradlew
          ./gradlew :app:assembleRelease --no-daemon
          rm -f "$KEYSTORE_FILE"

      - name: Verify signature
        run: |
          cp app/build/outputs/apk/release/app-release.apk "vocal-vault-$GITHUB_REF_NAME.apk"
          "$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner" verify --print-certs "vocal-vault-$GITHUB_REF_NAME.apk"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "vocal-vault-$GITHUB_REF_NAME.apk" \
            --title "Vocal Vault ${GITHUB_REF_NAME#v}" --notes-file RELEASE_NOTES.md --verify-tag
